kind = "mobile"
previewPath = "/"
title = "LAN Backup"
version = "1.0.0"
id = "artifacts/lan-backup"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19921

[services.development]
run = "pnpm --filter @workspace/lan-backup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lan-backup", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lan-backup", "run", "serve" ]

[services.env]
PORT = "19921"
BASE_PATH = "/"
